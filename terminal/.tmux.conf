##### ───────── BASIC SETTINGS ─────────

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -sg escape-time 10
set -g repeat-time 600
set -g focus-events on
set-environment -g TZ "Asia/Kolkata"
##### ───────── PREFIX ─────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### ───────── RELOAD ─────────

bind r source-file ~/.tmux.conf \; display "  config reloaded"

##### ───────── SPLITS & WINDOWS ─────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

##### ───────── PANE NAVIGATION ─────────

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n C-Left  resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up    resize-pane -U 5
bind -n C-Down  resize-pane -D 5

##### ───────── COPY MODE ─────────

setw -g mode-keys vi
bind [ copy-mode
bind-key -T copy-mode-vi v   send -X begin-selection
bind-key -T copy-mode-vi V   send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y   send -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Escape send -X cancel
bind R run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

set-option -g set-clipboard on

##### ───────── PANE BORDERS ─────────

set -g pane-border-style          "fg=#313244"
set -g pane-active-border-style   "fg=#89b4fa"
set -g pane-border-lines          single

##### ───────── COLORS: Catppuccin Mocha palette ─────────
#
#  bg-deep   #1e1e2e   terminal background
#  bg-bar    #181825   status bar
#  bg-tab    #313244   inactive tab / right block
#  blue      #cba6f7   active tab / session pill
#  fg-dim    #6c7086   secondary text
#  fg-main   #cdd6f4   primary text
#  green     #a6e3a1   ok / saved indicator
#  blue-txt  #89b4fa   active window text / borders

##### ───────── STATUS BAR ─────────

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"

# ── Left: session name pill ──
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#181825,fg=#cba6f7,nobold]"
set -g status-left-length 30

# ── Right: continuum status + time ──
set -g status-right "#[fg=#6c7086]  #[bg=#313244,fg=#cdd6f4] #(date '+%I:%M %p %a') #[bg=#181825]"
set -g status-right-length 50


# ── Window tabs ──
set -g window-status-separator " "

set -g window-status-format \
  "#[bg=#313244,fg=#6c7086] #I #W #[bg=#181825]"

set -g window-status-current-format \
  "#[bg=#cba6f7,fg=#1e1e2e,bold] #I #W #[bg=#181825,fg=#cba6f7,nobold]"

# ── Visual activity: flash tab, no bell ──
setw -g monitor-activity on
set  -g visual-activity  off
set -g window-status-activity-style "bg=#313244,fg=#cdd6f4,bold"

##### ───────── COPY MODE COLORS ─────────

set -g mode-style "bg=#cba6f7,fg=#1e1e2e"

##### ───────── PANE NUMBER DISPLAY ─────────

set -g display-panes-time          2000
set -g display-panes-colour        "#89b4fa"
set -g display-panes-active-colour "#cdd6f4"

##### ───────── MESSAGE / COMMAND LINE ─────────

set -g message-style         "bg=#cba6f7,fg=#1e1e2e"
set -g message-command-style "bg=#cba6f7,fg=#1e1e2e"

##### ───────── PLUGINS ─────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-strategy-nvim 'session'


##### ───────── INIT TPM ─────────

run '~/.tmux/plugins/tpm/tpm'

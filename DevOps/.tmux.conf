##### ───────── BASIC SETTINGS ─────────

set -g mouse on
set -g history-limit 100000          # Increased for deeper scrollback
set -g base-index 1                  # Start windows at 1
setw -g pane-base-index 1            # Start panes at 1
set -g renumber-windows on           # Auto-renumber windows on close
set -g set-clipboard on              # Use system clipboard

# Better True Color Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -sg escape-time 50                
set -g repeat-time 600
set -g focus-events on
set-environment -g TZ "Asia/Kolkata"

##### ───────── PREFIX ─────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### ───────── RELOAD ─────────

bind r source-file ~/.tmux.conf \; display-message " 󰚰 Config reloaded"

##### ───────── SPLITS & WINDOWS ─────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

##### ───────── PANE NAVIGATION & RESIZING ─────────

# Resize panes with Prefix + Ctrl-Arrow
bind -r C-Left  resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up    resize-pane -U 5
bind -r C-Down  resize-pane -D 5

##### ───────── COPY MODE ─────────

setw -g mode-keys vi
bind [ copy-mode
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y is handled automatically by the tmux-yank plugin below
bind-key -T copy-mode-vi Escape send-keys -X cancel

##### ───────── COLORS: Tokyo Night Storm Palette ─────────
#
#  bg-main   #24283b   terminal background
#  bg-status #1f2335   status bar background
#  bg-dim    #292e42   inactive tabs
#  blue      #7aa2f7   primary accent / active tab
#  purple    #bb9af7   secondary accent / session pill
#  fg-main   #c0caf5   primary text
#  fg-dim    #565f89   inactive text

##### ───────── PANE BORDERS ─────────

set -g pane-border-style          "fg=#292e42"
set -g pane-active-border-style   "fg=#7aa2f7"
set -g pane-border-lines          single

##### ───────── STATUS BAR ─────────

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g status-justify left

# ── Left: Session name pill (Purple) ──
set -g status-left-length 40
set -g status-left "#[fg=#bb9af7,bg=#1f2335]#[bg=#bb9af7,fg=#1f2335,bold]  #S #[fg=#bb9af7,bg=#1f2335,nobold] "

# ── Right: Time and Date pill (Blue) ──
set -g status-right-length 50
set -g status-right "#[fg=#7aa2f7,bg=#1f2335]#[bg=#7aa2f7,fg=#1f2335,bold]  %I:%M %p 󰃭 %a #[fg=#7aa2f7,bg=#1f2335,nobold]"

# ── Window tabs ──
set -g window-status-separator ""

# Inactive Window
set -g window-status-format \
  "#[fg=#292e42,bg=#1f2335]#[bg=#292e42,fg=#c0caf5] #I: #W #[fg=#292e42,bg=#1f2335]"

# Active Window
set -g window-status-current-format \
  "#[fg=#7aa2f7,bg=#1f2335]#[bg=#7aa2f7,fg=#1f2335,bold] #I: #W #[fg=#7aa2f7,bg=#1f2335,nobold]"

# ── Visual activity ──
setw -g monitor-activity on
set  -g visual-activity  off
set -g window-status-activity-style "bg=#1f2335,fg=#bb9af7,bold"

##### ───────── COPY MODE COLORS ─────────

set -g mode-style "bg=#7aa2f7,fg=#1f2335,bold"

##### ───────── MESSAGE / COMMAND LINE ─────────

set -g message-style         "bg=#bb9af7,fg=#1f2335,bold"
set -g message-command-style "bg=#bb9af7,fg=#1f2335,bold"

##### ───────── PANE NUMBER DISPLAY ─────────

set -g display-panes-time          2000
set -g display-panes-colour        "#292e42"
set -g display-panes-active-colour "#7aa2f7"

##### ───────── PLUGINS ─────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'            # Handles WSL clipboard natively
# set -g @plugin 'christoomey/vim-tmux-navigator'    

# Plugin configurations
set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-vim  'session'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'pschmitt/tmux-ssh-split'

# Configure the plugin to use your existing split keys
set-option -g @ssh-split-h-key "|"
set-option -g @ssh-split-v-key "-"

##### ───────── INIT TPM ─────────
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
